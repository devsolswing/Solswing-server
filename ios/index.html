<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolSwing - Loading...</title>
<style>body{background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0} .loader{text-align:center} .bar{width:200px;height:8px;background:#333;border-radius:4px;margin:20px auto;overflow:hidden} .fill{height:100%;background:#4ade80;width:0%;transition:width .3s}</style>
</head>
<body>
<div class="loader">
<h2>🎮 SolSwing</h2>
<p id="status">Loading game...</p>
<div class="bar"><div class="fill" id="fill"></div></div>
</div>
<script>
async function load() {
  const chunks = ['chunk_aa.txt','chunk_ab.txt','chunk_ac.txt','chunk_ad.txt'];
  const base = 'https://raw.githubusercontent.com/devsolswing/Solswing-server/main/ios/';
  let html = '';
  for (let i = 0; i < chunks.length; i++) {
    document.getElementById('status').textContent = 'Loading part ' + (i+1) + ' of 4...';
    document.getElementById('fill').style.width = ((i/chunks.length)*100) + '%';
    const res = await fetch(base + chunks[i]);
    html += await res.text();
  }
  document.open();
  document.write(html);
  document.close();
}
load().catch(e => {
  document.getElementById('status').textContent = 'Failed to load: ' + e.message;
});
</script>
</body>
</html>
