<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolSwing</title>
<style>body{background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center} .bar{width:200px;height:8px;background:#333;border-radius:4px;margin:20px auto;overflow:hidden} .fill{height:100%;background:#4ade80;width:0%;transition:width .3s}</style>
</head>
<body>
<div id="loader">
<h2>🎮 SolSwing</h2>
<p id="status">Loading game...</p>
<div class="bar"><div class="fill" id="fill"></div></div>
</div>
<script>
(async function() {
  const chunks = ['chunk_aa.txt','chunk_ab.txt','chunk_ac.txt','chunk_ad.txt'];
  const base = 'https://raw.githubusercontent.com/devsolswing/Solswing-server/main/ios/';
  let html = '';
  for (let i = 0; i < chunks.length; i++) {
    document.getElementById('status').textContent = 'Loading part ' + (i+1) + ' of 4...';
    document.getElementById('fill').style.width = ((i/chunks.length)*100) + '%';
    const res = await fetch(base + chunks[i]);
    html += await res.text();
  }
  // Parse the HTML and replace document content WITHOUT document.write
  // document.write creates a new document that loses Phantom's provider bridge on iOS
  // Instead, we replace the entire <html> content while keeping the same window/document
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  // Copy head content
  document.head.innerHTML = doc.head.innerHTML;
  // Copy body content
  document.body.innerHTML = doc.body.innerHTML;
  // Execute scripts manually (innerHTML doesn't run scripts)
  const scripts = doc.querySelectorAll('script');
  for (const oldScript of scripts) {
    const newScript = document.createElement('script');
    if (oldScript.src) {
      newScript.src = oldScript.src;
    } else {
      newScript.textContent = oldScript.textContent;
    }
    // Copy attributes
    for (const attr of oldScript.attributes) {
      newScript.setAttribute(attr.name, attr.value);
    }
    document.body.appendChild(newScript);
  }
  // Copy html attributes
  for (const attr of doc.documentElement.attributes) {
    document.documentElement.setAttribute(attr.name, attr.value);
  }
})();
</script>
</body>
</html>
